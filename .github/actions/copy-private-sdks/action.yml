name: Copy Private SDKs
description: Checks out the private SDK repo and copies its binaries into the module directories that need them.

inputs:
  token:
    description: Token with read access to Catappult/wallet-private-sdks
    required: true

runs:
  using: composite
  steps:
    - name: Checkout private SDKs
      uses: actions/checkout@v7
      with:
        repository: Catappult/wallet-private-sdks
        token: ${{ inputs.token }}
        path: private-sdks
        lfs: true

    - name: Copy private SDKs
      shell: bash
      run: |
        mkdir -p core/network/base/libs app/libs libs/
        cp private-sdks/android-magnessdk-5.3.0.aar core/network/base/libs/android-magnessdk-5.3.0.aar
        cp private-sdks/android-magnessdk-5.3.0.aar app/libs/android-magnessdk-5.3.0.aar
        cp -r private-sdks/vk-maven libs/
