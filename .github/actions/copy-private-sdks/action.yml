name: Copy Private SDKs
description: Copies private SDK binaries from the checked out private-sdks repo into the correct module directories.

runs:
  using: composite
  steps:
    - name: Copy private SDKs
      shell: bash
      run: |
        mkdir -p core/network/base/libs app/libs libs/
        cp private-sdks/android-magnessdk-5.3.0.aar core/network/base/libs/android-magnessdk-5.3.0.aar
        cp private-sdks/android-magnessdk-5.3.0.aar app/libs/android-magnessdk-5.3.0.aar
        cp -r private-sdks/vk-maven libs/