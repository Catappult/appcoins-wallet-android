name: Wallet_Build-Test_PR

on:
  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

# A new push to the same PR replaces the run in progress.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Copy private SDKs
        uses: ./.github/actions/copy-private-sdks
        with:
          token: ${{ secrets.PRIVATE_SDKS_PAT }}

      - name: Android Environment Setup
        uses: ./.github/actions/android-setup
        with:
          keystore-dev-base64: ${{ secrets.BDS_WALLET_DEV_KEYSTORE_BASE64 }}
          google-services-json-dev: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          gradle-properties: ${{ secrets.GRADLE_PROPERTIES }}

      - name: Run Unit Tests
        run: ./gradlew testAptoideDebugUnitTest testGpDebugUnitTest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Copy private SDKs
        uses: ./.github/actions/copy-private-sdks
        with:
          token: ${{ secrets.PRIVATE_SDKS_PAT }}

      - name: Android Environment Setup
        uses: ./.github/actions/android-setup
        with:
          keystore-dev-base64: ${{ secrets.BDS_WALLET_DEV_KEYSTORE_BASE64 }}
          google-services-json-dev: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          gradle-properties: ${{ secrets.GRADLE_PROPERTIES }}

      - name: Lint
        run: ./gradlew lintAptoideDebug lintGpDebug

  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Copy private SDKs
        uses: ./.github/actions/copy-private-sdks
        with:
          token: ${{ secrets.PRIVATE_SDKS_PAT }}

      - name: Android Environment Setup
        uses: ./.github/actions/android-setup
        with:
          keystore-dev-base64: ${{ secrets.BDS_WALLET_DEV_KEYSTORE_BASE64 }}
          google-services-json-dev: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          gradle-properties: ${{ secrets.GRADLE_PROPERTIES }}

      - name: Build Debug APKs
        run: ./gradlew assembleAptoideDebug assembleGpDebug

      - name: Upload Aptoide Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: aptoide-debug-apk
          path: app/build/outputs/apk/aptoide/debug/*.apk
          retention-days: 7

      - name: Upload GP Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gp-debug-apk
          path: app/build/outputs/apk/gp/debug/*.apk
          retention-days: 7
