name: PR Debug Build

on:
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: echo "y" | sdkmanager "ndk;28.2.13676358"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testAptoideDebugUnitTest testGpDebugUnitTest

      - name: Lint
        run: ./gradlew lintAptoideDebug lintGpDebug

      - name: Build Debug APKs
        run: ./gradlew assembleAptoideDebug assembleGpDebug

      - name: Upload Aptoide Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aptoide-debug-apk
          path: app/build/outputs/apk/aptoide/debug/*.apk
          retention-days: 7

      - name: Upload GP Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gp-debug-apk
          path: app/build/outputs/apk/gp/debug/*.apk
          retention-days: 7
