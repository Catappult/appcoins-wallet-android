name: PR Debug Build

on:
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: echo "y" | sdkmanager "ndk;28.2.13676358"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode debug keystore
        run: echo "${{ secrets.BDS_WALLET_DEV_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/dev.keystore

      - name: Checkout private SDKs
        uses: actions/checkout@v4
        with:
          repository: Catappult/wallet-private-sdks
          token: ${{ secrets.PRIVATE_SDKS_PAT }}
          path: /tmp/private-sdks
          lfs: true

      - name: Copy private SDKs
        run: |
          cp /tmp/private-sdks/android-magnessdk-5.3.0.aar core/network/base/libs/android-magnessdk-5.3.0.aar
          cp /tmp/private-sdks/android-magnessdk-5.3.0.aar app/libs/android-magnessdk-5.3.0.aar
          cp -r /tmp/private-sdks/libs/vk-maven libs/

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_DEV" | base64 --decode > ${{ github.workspace }}/app/src/debug/google-services.json

      - name: Inject gradle.properties
        env:
          GRADLE_PROPERTIES: ${{ secrets.GRADLE_PROPERTIES }}
        run: |
          printf '%s\n' "$GRADLE_PROPERTIES" >> gradle.properties
          echo "BDS_WALLET_DEV_STORE_FILE=${{ github.workspace }}/dev.keystore" >> gradle.properties

      - name: Run Unit Tests
        run: ./gradlew testAptoideDebugUnitTest testGpDebugUnitTest

      - name: Lint
        run: ./gradlew lintAptoideDebug lintGpDebug

      - name: Build Debug APKs
        run: ./gradlew assembleAptoideDebug assembleGpDebug
