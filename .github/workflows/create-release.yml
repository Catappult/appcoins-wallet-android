name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  setup:
    name: Prepare build environment
    runs-on: ubuntu-latest
    outputs:
      new_name: ${{ steps.version.outputs.new_name }}
      new_code: ${{ steps.version.outputs.new_code }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout private SDKs
        uses: actions/checkout@v4
        with:
          repository: Catappult/wallet-private-sdks
          token: ${{ secrets.PRIVATE_SDKS_PAT }}
          path: private-sdks
          lfs: true

      - name: Copy private SDKs
        uses: ./.github/actions/copy-private-sdks

      - name: Bump version
        id: version
        run: |
          CURRENT_CODE=$(grep 'versionCode\s*=' app/build.gradle.kts | grep -o '[0-9]\+')
          CURRENT_NAME=$(grep 'versionName\s*=' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')

          MAJOR=$(echo "$CURRENT_NAME" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_NAME" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_NAME" | cut -d. -f3)

          case "${{ github.event.inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_NAME="$MAJOR.$MINOR.$PATCH"
          NEW_CODE=$((CURRENT_CODE + 1))

          sed -i "s/versionCode = $CURRENT_CODE/versionCode = $NEW_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"$CURRENT_NAME\"/versionName = \"$NEW_NAME\"/" app/build.gradle.kts

          echo "new_name=$NEW_NAME" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: |
            .
            !private-sdks
          retention-days: 1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Android Environment Setup
        uses: ./.github/actions/android-setup
        with:
          keystore-dev-base64: ${{ secrets.BDS_WALLET_DEV_KEYSTORE_BASE64 }}
          google-services-json-dev: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          gradle-properties: ${{ secrets.GRADLE_PROPERTIES }}

      - name: Run Unit Tests
        run: ./gradlew testAptoideDebugUnitTest testGpDebugUnitTest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Android Environment Setup
        uses: ./.github/actions/android-setup
        with:
          keystore-release-base64: ${{ secrets.BDS_WALLET_RELEASE_KEYSTORE_BASE64 }}
          google-services-json-release: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          gradle-properties: ${{ secrets.GRADLE_PROPERTIES }}

      - name: Lint
        run: ./gradlew lintAptoideRelease lintGpRelease

  build:
    name: Build Release APKs
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Android Environment Setup
        uses: ./.github/actions/android-setup
        with:
          keystore-release-base64: ${{ secrets.BDS_WALLET_RELEASE_KEYSTORE_BASE64 }}
          google-services-json-release: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          gradle-properties: ${{ secrets.GRADLE_PROPERTIES }}

      - name: Build Release APKs
        run: ./gradlew assembleAptoideRelease assembleGpRelease

      - name: Upload Aptoide Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aptoide-release-apk
          path: app/build/outputs/apk/aptoide/release/*.apk
          retention-days: 7

      - name: Upload GP Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gp-release-apk
          path: app/build/outputs/apk/gp/release/*.apk
          retention-days: 7

  release:
    name: Create release branch
    runs-on: ubuntu-latest
    needs: [unit-tests, lint, build]
    environment: production
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

#      - name: Commit and push to dev
#        run: |
#          git config user.name "github-actions[bot]"
#          git config user.email "github-actions[bot]@users.noreply.github.com"
#          git add app/build.gradle.kts
#          git commit -m "chore: bump version to ${{ needs.setup.outputs.new_name }} (versionCode ${{ needs.setup.outputs.new_code }})"
#          git push origin dev

      - name: Create and push release branch
        run: |
          git checkout -b release/${{ needs.setup.outputs.new_name }}
          git push origin release/${{ needs.setup.outputs.new_name }}