name: Create Release

# Step 1 of a release: bumps the version on top of dev and pushes release/X.Y.Z.
# Open the pull request to master yourself from the link in the run summary: a pull request
# opened by the workflow token would not start the PR checks.
# Step 2 is publish-release.yml, which runs when that pull request is merged.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Only show the new version, push nothing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-branch:
    name: Create release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT_CODE=$(grep 'versionCode\s*=' app/build.gradle.kts | grep -o '[0-9]\+')
          CURRENT_NAME=$(grep 'versionName\s*=' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')

          MAJOR=$(echo "$CURRENT_NAME" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_NAME" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_NAME" | cut -d. -f3)

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_NAME="$MAJOR.$MINOR.$PATCH"
          NEW_CODE=$((CURRENT_CODE + 1))

          sed -i "s/versionCode = $CURRENT_CODE/versionCode = $NEW_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"$CURRENT_NAME\"/versionName = \"$NEW_NAME\"/" app/build.gradle.kts
          git diff --quiet && { echo "Version was not changed in app/build.gradle.kts" >&2; exit 1; }

          echo "new_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "new_code=$NEW_CODE" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        env:
          NEW_NAME: ${{ steps.version.outputs.new_name }}
          NEW_CODE: ${{ steps.version.outputs.new_code }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would push \`release/$NEW_NAME\` ($NEW_CODE)." >> "$GITHUB_STEP_SUMMARY"
            git diff
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/$NEW_NAME"
          git commit -am "Bump version code to $NEW_CODE and update version name to $NEW_NAME"
          git push origin "release/$NEW_NAME"
          echo "Pushed \`release/$NEW_NAME\` ($NEW_CODE). [Open the pull request to master]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/master...release/$NEW_NAME?expand=1&title=Release%20$NEW_NAME)" >> "$GITHUB_STEP_SUMMARY"
