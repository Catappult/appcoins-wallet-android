name: Update Gradle Cache

on:
  push:
    branches:
      - dev
      # master is the default branch: every PR can read caches saved from it.
      - master
  schedule:
    # GitHub evicts caches unused for 7 days.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-cache:
    name: Update Gradle Cache
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Copy private SDKs
        uses: ./.github/actions/copy-private-sdks
        with:
          token: ${{ secrets.PRIVATE_SDKS_PAT }}

      - name: Android Environment Setup
        uses: ./.github/actions/android-setup
        with:
          keystore-dev-base64: ${{ secrets.BDS_WALLET_DEV_KEYSTORE_BASE64 }}
          google-services-json-dev: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
          gradle-properties: ${{ secrets.GRADLE_PROPERTIES }}

      - name: Warm up Gradle cache
        run: ./gradlew assembleAptoideDebug assembleGpDebug --no-daemon
